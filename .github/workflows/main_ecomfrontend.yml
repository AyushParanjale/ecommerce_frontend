name: Build and deploy React App

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - run: npm ci

      - run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - uses: actions/upload-artifact@v4
        with:
          name: vite-build
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vite-build

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ecomfrontend
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_27A712D233D44988B44744767B846B03 }}
          package: .
